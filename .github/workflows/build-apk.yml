name: Build CryptoMasterX1 Android APK

on:
  workflow_dispatch:
  push:
    branches: [ main ]

jobs:
  build:
    runs-on: ubuntu-22.04
    timeout-minutes: 60

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17

      - name: Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install system dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            git zip unzip \
            autoconf automake libtool libtool-bin \
            pkg-config cmake \
            zlib1g-dev libncurses5-dev libncursesw5-dev libtinfo6 \
            libffi-dev libssl-dev

      - name: Install buildozer + cython
        run: |
          pip install --upgrade pip setuptools wheel
          pip install "cython<3.0" buildozer

      - name: Show relevant buildozer.spec lines
        run: |
          echo "--- requirements ---"
          grep "^requirements" buildozer.spec
          echo "--- source.dir ---"
          grep "^source.dir" buildozer.spec
          echo "--- android config ---"
          grep -E "^android\.(api|minapi|ndk|archs)" buildozer.spec

      - name: Build APK
        run: |
          buildozer -v android debug 2>&1 | tee buildozer.log

      - name: Upload APK artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: CryptoMasterX1-APK
          path: |
            bin/*.apk
            buildozer.log
          if-no-files-found: warn
          retention-days: 30
