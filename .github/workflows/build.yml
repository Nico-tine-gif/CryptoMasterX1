name: Build CryptoMasterX1 Android APK

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
    - name: Checkout Repository Source
      uses: actions/checkout@v4

    - name: Setup System Environment Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y git zip unzip openjdk-17-jdk python3-pip autoconf libtool pkg-config zlib1g-dev libncurses5-dev libssl-dev cmake

    - name: Install Buildozer Engine
      run: |
        pip3 install --upgrade pip
        pip3 install buildozer cython

    - name: Cache Buildozer Artifacts
      uses: actions/cache@v4
      with:
        path: .buildozer
        key: ${{ runner.os }}-buildozer-${{ hashFiles('buildozer.spec') }}

    - name: Compile Application Layout into Release APK
      run: |
        buildozer android debug

    - name: Upload Finished System Binaries Asset
      uses: actions/upload-artifact@v4
      with:
        name: CryptoMasterX1-Release-APK
        path: bin/*.apk
