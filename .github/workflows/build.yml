name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Install dependencies
        run: |
          sudo apt update -qq
          sudo apt install -y python3-pip zip unzip libncurses6 libstdc++6 libbz2-1.0 libffi-dev libssl-dev libltdl-dev autoconf automake libtool pkg-config

      - name: Build APK
        run: |
          set -e
          export ANDROID_SDK_ROOT=$HOME/android-sdk
          export ANDROID_HOME=$ANDROID_SDK_ROOT
          rm -rf $ANDROID_SDK_ROOT
          mkdir -p $ANDROID_SDK_ROOT/cmdline-tools
          cd $ANDROID_SDK_ROOT/cmdline-tools
          wget -q https://dl.google.com/android/repository/commandlinetools-linux-11076708_latest.zip -O tools.zip
          unzip -q tools.zip
          rm tools.zip
          mv cmdline-tools latest
          export PATH=$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH

          yes | sdkmanager --licenses
          sdkmanager "build-tools;35.0.0" "platforms;android-35" "platform-tools"

          mkdir -p $ANDROID_SDK_ROOT/tools/bin
          cat > $ANDROID_SDK_ROOT/tools/bin/sdkmanager << 'SHIM'
          #!/bin/bash
          exec $HOME/android-sdk/cmdline-tools/latest/bin/sdkmanager "$@"
          SHIM
          chmod +x $ANDROID_SDK_ROOT/tools/bin/sdkmanager

          mkdir -p $HOME/.buildozer/android/platform
          rm -rf $HOME/.buildozer/android/platform/android-sdk
          ln -s $ANDROID_SDK_ROOT $HOME/.buildozer/android/platform/android-sdk

          cd $GITHUB_WORKSPACE
          pip install --upgrade pip
          pip install cython==0.29.36
          pip install https://github.com/kivy/buildozer/archive/master.zip
          pip install https://github.com/kivy/python-for-android/archive/master.zip

          # Clean old builds
          rm -rf.buildozer bin

          buildozer android debug --verbose 2>&1 | tail -n 200

      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: apk
          path: bin/*.apk

      - name: Show log on failure
        if: failure()
        run: cat ~/.buildozer/logs/buildozer.log || true
