name: Build APK
on:
  push:
    branches: [ main ]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.10'
      - uses: actions/setup-java@v4
        with:
          distribution: 'temurin'
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Fix SDK paths for Buildozer
        run: |
          sdkmanager --install "build-tools;33.0.2" "platforms;android-33" "platform-tools" "ndk;25.1.8937393"
          yes | sdkmanager --licenses || true
          ls /usr/local/lib/android/sdk/build-tools/
      - name: Build
        run: |
          pip install cython==0.29.36 buildozer==1.5.0
          buildozer android debug --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: cryptomasterx1-apk
          path: bin/*.apk
