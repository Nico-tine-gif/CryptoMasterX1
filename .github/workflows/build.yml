name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0" "build-tools;37.0.0" "platforms;android-35" "platform-tools"

          # CRITICAL FIX: Force buildozer's private SDK to be host SDK
          mkdir -p $HOME/.buildozer/android/platform
          rm -rf $HOME/.buildozer/android/platform/android-sdk
          ln -s $ANDROID_SDK_ROOT $HOME/.buildozer/android/platform/android-sdk

          # Copy licenses too
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          cp -r $ANDROID_SDK_ROOT/licenses/* $HOME/.buildozer/android/platform/android-sdk/licenses/ || true

          pip install cython==0.29.36
          pip install https://github.com/kivy/buildozer/archive/master.zip
          pip install https://github.com/kivy/python-for-android/archive/master.zip
          buildozer android debug --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
