name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK + NDK
        run: |
          set -e

          yes | sdkmanager --licenses

          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"

          echo "===== SDK ====="
          sdkmanager --list_installed | grep -E 'platform-tools|platforms;android-35|build-tools;35.0.0|ndk;25.2.9519653' || true

          echo "===== NDK ====="
          ls -la "$ANDROID_SDK_ROOT/ndk/25.2.9519653"

          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"

      - name: Configure NDK
        run: |
          set -e

          export NDK_HOME="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          export ANDROID_NDK_HOME="$NDK_HOME"
          export ANDROID_NDK_ROOT="$NDK_HOME"

          echo "NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_HOME=$NDK_HOME" >> "$GITHUB_ENV"
          echo "ANDROID_NDK_ROOT=$NDK_HOME" >> "$GITHUB_ENV"

          echo "===== NDK VERSION ====="
          "$NDK_HOME/ndk-build" --version

      - name: Install Python build tools
        run: |
          set -e
          python3 -m pip install --upgrade pip setuptools wheel
          python3 -m pip install cython==0.29.36
          python3 -m pip install https://github.com/kivy/buildozer/archive/master.zip
          python3 -m pip install https://github.com/kivy/python-for-android/archive/master.zip

      - name: Clean Buildozer cache
        run: |
          set -e
          rm -rf "$HOME/.buildozer/android/platform/android-sdk"

      - name: Link Android SDK
        run: |
          set -e

          mkdir -p "$HOME/.buildozer/android/platform"

          ln -s "$ANDROID_SDK_ROOT" \
            "$HOME/.buildozer/android/platform/android-sdk"

          echo "===== BUILDZER SDK ====="
          ls -ld "$HOME/.buildozer/android/platform/android-sdk"

      - name: Verify Android tools
        run: |
          set -e

          echo "===== AIDL ====="
          find "$ANDROID_SDK_ROOT" -type f -name aidl -print

          echo "===== AAPT2 ====="
          find "$ANDROID_SDK_ROOT" -type f -name aapt2 -print

          echo "===== NDK ====="
          find "$ANDROID_SDK_ROOT/ndk/25.2.9519653" -maxdepth 3 -type f -name clang | head

      - name: Build APK
        run: |
          set -e

          export ANDROID_SDK_ROOT="$ANDROID_SDK_ROOT"
          export ANDROID_HOME="$ANDROID_SDK_ROOT"
          export ANDROID_NDK_HOME="$ANDROID_SDK_ROOT/ndk/25.2.9519653"
          export ANDROID_NDK_ROOT="$ANDROID_NDK_HOME"

          echo "===== FINAL BUILD ENV ====="
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_NDK_HOME=$ANDROID_NDK_HOME"

          echo "===== BUILDOZER SPEC ====="
          grep -E '^(requirements|android.api|android.minapi|android.ndk|android.ndk_path)' buildozer.spec || true

          buildozer android clean || true
          buildozer android debug --verbose

      - name: Locate APK
        run: |
          set -e
          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoMasterX1-APK
          path: |
            bin/*.apk
            **/build/outputs/apk/**/*.apk
          if-no-files-found: error
