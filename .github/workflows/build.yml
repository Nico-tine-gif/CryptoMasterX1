name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Java 11 for sdkmanager
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '11'

      - uses: android-actions/setup-android@v3

      - name: Build APK
        run: |
          set -e
          echo "--- Using Java 11 for sdkmanager fix ---"
          export JAVA_HOME=$JAVA_HOME_11_X64
          export PATH=$JAVA_HOME/bin:$PATH
          java -version

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0" "platforms;android-35" "platform-tools" "ndk;25b"

          mkdir -p $HOME/.buildozer/android/platform
          rm -rf $HOME/.buildozer/android/platform/android-sdk
          ln -s $ANDROID_SDK_ROOT $HOME/.buildozer/android/platform/android-sdk

          echo "--- Switch to Java 17 for Gradle build ---"
          export JAVA_HOME=$JAVA_HOME_17_X64
          export PATH=$JAVA_HOME/bin:$PATH
          java -version

          pip install cython==0.29.36
          pip install https://github.com/kivy/buildozer/archive/master.zip
          pip install https://github.com/kivy/python-for-android/archive/master.zip
          buildozer android debug --verbose

      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
