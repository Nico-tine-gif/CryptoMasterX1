name: Build APK
on:
  push:
    branches: [main]
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: android-actions/setup-android@v3
      - name: Build APK
        run: |
          set -x
          echo "SDK_ROOT=$ANDROID_SDK_ROOT"
          echo "ANDROID_HOME=$ANDROID_HOME"
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager "build-tools;35.0.0" "build-tools;34.0.0" "platforms;android-35" "platform-tools"

          echo "=== Host SDK build-tools ==="
          ls $ANDROID_SDK_ROOT/build-tools/
          ls $ANDROID_SDK_ROOT/build-tools/35.0.0/ | grep aidl

          echo "=== Linking to p4a private SDK ==="
          mkdir -p $HOME/.buildozer/android/platform
          rm -rf $HOME/.buildozer/android/platform/android-sdk
          ln -s $ANDROID_SDK_ROOT $HOME/.buildozer/android/platform/android-sdk
          mkdir -p $HOME/.buildozer/android/platform/android-sdk/licenses
          cp -r $ANDROID_SDK_ROOT/licenses/* $HOME/.buildozer/android/platform/android-sdk/licenses/ || true

          echo "=== Linked SDK build-tools ==="
          ls $HOME/.buildozer/android/platform/android-sdk/build-tools/
          ls $HOME/.buildozer/android/platform/android-sdk/build-tools/35.0.0/ | grep aidl
          which aidl || echo "aidl not in PATH but file exists above, OK"

          pip install cython==0.29.36
          pip install https://github.com/kivy/buildozer/archive/master.zip
          pip install https://github.com/kivy/python-for-android/archive/master.zip
          buildozer android debug --verbose
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
