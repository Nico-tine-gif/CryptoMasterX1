name: build
on: [push, workflow_dispatch]
jobs:
  build:
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: {python-version: '3.11'}
      - uses: actions/setup-java@v4
        with: {distribution: temurin, java-version: '17'}
      - name: Build debug APK
        run: |
          pip install "pip==24.0" -q
          pip install Cython==0.29.36 buildozer -q
          pip install https://github.com/kivy/python-for-android/archive/master.zip -q
          PY=$(python -c "import site; print(site.getsitepackages()[0])")
          sed -i 's/pip install -U pip/pip install pip==24.0/g' $PY/pythonforandroid/build.py
          sed -i 's/--upgrade pip/==24.0/g' $PY/pythonforandroid/build.py
          buildozer android debug
      - uses: actions/upload-artifact@v4
        with:
          name: apk
          path: bin/*.apk
