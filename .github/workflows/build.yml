name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install exact Android SDK components
        shell: bash
        run: |
          set -euxo pipefail

          yes | sdkmanager --licenses >/dev/null || true

          sdkmanager \
            "platform-tools" \
            "platforms;android-33" \
            "build-tools;35.0.0" \
            "ndk;25.2.9519653"

          yes | sdkmanager --licenses >/dev/null || true

      - name: Verify Android SDK and AIDL
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME/platforms/android-33"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"

          "$ANDROID_HOME/build-tools/35.0.0/aidl" --version

          echo "===== BUILD TOOLS ====="
          ls -la "$ANDROID_HOME/build-tools/35.0.0"

          echo "===== AIDL ====="
          command -v aidl || true
          ls -l "$ANDROID_HOME/build-tools/35.0.0/aidl"

      - name: Configure Buildozer environment
        shell: bash
        run: |
          set -euxo pipefail

          echo "ANDROIDSDK=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDSDK_ROOT=$ANDROID_HOME" >> "$GITHUB_ENV"
          echo "ANDROIDAPI=33" >> "$GITHUB_ENV"
          echo "ANDROIDMINAPI=21" >> "$GITHUB_ENV"
          echo "ANDROIDNDK=$ANDROID_HOME/ndk/25.2.9519653" >> "$GITHUB_ENV"

          echo "$ANDROID_HOME/build-tools/35.0.0" >> "$GITHUB_PATH"
          echo "$ANDROID_HOME/platform-tools" >> "$GITHUB_PATH"

      - name: Install Buildozer
        shell: bash
        run: |
          set -euxo pipefail

          python -m pip install --upgrade pip setuptools wheel
          python -m pip install --upgrade buildozer cython

      - name: Clean old Buildozer SDK state
        shell: bash
        run: |
          set -euxo pipefail

          rm -rf .buildozer/android/platform/android-sdk

          mkdir -p .buildozer

      - name: Verify Buildozer configuration
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== buildozer.spec ====="
          sed -n '1,220p' buildozer.spec

          echo "===== ANDROID ENVIRONMENT ====="
          echo "ANDROIDSDK=$ANDROIDSDK"
          echo "ANDROIDAPI=$ANDROIDAPI"
          echo "ANDROIDMINAPI=$ANDROIDMINAPI"
          echo "ANDROIDNDK=$ANDROIDNDK"

          test -x "$ANDROID_HOME/build-tools/35.0.0/aidl"

      - name: Build debug APK
        shell: bash
        env:
          BUILDOZER_WARN_ON_ROOT: "1"
        run: |
          set -euxo pipefail

          buildozer android debug

      - name: Locate APK
        shell: bash
        run: |
          set -euxo pipefail

          echo "===== APK FILES ====="
          find . -type f -name "*.apk" -print

          APK="$(find . -type f -name "*.apk" | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: No APK was produced"
            exit 1
          fi

          echo "APK FOUND: $APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoMasterX1-debug-apk
          path: "**/*.apk"
          if-no-files-found: error
