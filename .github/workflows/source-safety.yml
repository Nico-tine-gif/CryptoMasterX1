name: CryptoMasterX1 Source Safety

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-24.04

    steps:
      - uses: actions/checkout@v4

      - name: Check for accidentally committed secrets
        shell: bash
        run: |
          set -e

          echo "Checking tracked files for obvious secret files..."

          BAD=0

          while IFS= read -r f; do
            case "$f" in
              .env|.env.*|*.pem|*.key|*.p12|*.jks|*.keystore)
                echo "FORBIDDEN TRACKED FILE: $f"
                BAD=1
                ;;
            esac
          done < <(git ls-files)

          if [ "$BAD" -ne 0 ]; then
            echo
            echo "Remove secret files before building."
            exit 1
          fi

          echo "Source safety check passed."
