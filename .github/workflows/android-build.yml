name: CryptoMasterX1 Android APK

on:
  workflow_dispatch:
  push:
    branches:
      - main
      - master

permissions:
  contents: read

jobs:
  build:
    name: Build CryptoMasterX1
    runs-on: ubuntu-24.04

    env:
      PYTHONUNBUFFERED: "1"
      P4A_RELEASES: "1"

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Verify x86_64 runner
        run: |
          set -eux
          uname -a
          test "$(uname -m)" = "x86_64"

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Install system dependencies
        run: |
          sudo apt-get update

          sudo apt-get install -y \
            build-essential \
            git \
            zip \
            unzip \
            wget \
            curl \
            autoconf \
            automake \
            autopoint \
            libtool \
            pkg-config \
            libffi-dev \
            libssl-dev \
            libltdl-dev \
            cmake \
            ccache

      - name: Install Python build tools
        run: |
          python -m pip install --upgrade \
            pip \
            setuptools \
            wheel

          python -m pip install \
            "buildozer==1.5.0"

      - name: Verify tools
        run: |
          python --version
          java -version
          buildozer --version

      - name: Verify project
        run: |
          test -f buildozer.spec
          test -f main.py

          echo
          echo "=== BUILD CONFIG ==="

          grep -nE \
            '^(title|package.name|package.domain|source.dir|source.include_exts|version|requirements|orientation|android.permissions|android.api|android.minapi|android.ndk|android.archs)' \
            buildozer.spec

      - name: Clean previous build state
        run: |
          rm -rf .buildozer
          rm -rf bin

      - name: Build debug APK
        run: |
          buildozer -v android debug

      - name: Find APK
        id: apk
        shell: bash
        run: |
          set -e

          APK="$(find bin \
            -type f \
            -name '*.apk' \
            | head -n 1)"

          if [ -z "$APK" ]; then
            echo "ERROR: APK was not produced."
            echo
            echo "bin contents:"
            find bin -maxdepth 3 -type f -print 2>/dev/null || true
            exit 1
          fi

          echo "APK=$APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Verify APK
        run: |
          APK="${{ steps.apk.outputs.path }}"

          echo "============================================================"
          echo "APK BUILD SUCCESS"
          echo "============================================================"

          ls -lh "$APK"

          echo
          echo "SHA256:"
          sha256sum "$APK"

          echo
          echo "APK:"
          echo "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: CryptoMasterX1-debug-apk
          path: ${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload diagnostics on failure
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: CryptoMasterX1-build-diagnostics
          path: |
            .buildozer/
            buildozer.spec
          if-no-files-found: ignore
          retention-days: 7
