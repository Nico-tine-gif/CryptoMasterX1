name: Build APK

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup Python
        uses: actions/setup-python@v4
        with:
          python-version: '3.9'
          
      - name: Install Buildozer
        run: |
          pip install buildozer
          buildozer --version
          
      - name: Build APK
        run: |
          buildozer android debug 2>&1 | tee build.log || echo "Build had issues"

      - name: Upload APK if exists
        uses: actions/upload-artifact@v4
        with:
          name: CryptoMasterX1
          path: |
            bin/*.apk
            build.log
          if-no-files-found: warn
